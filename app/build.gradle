plugins {
    id "com.android.application"
}

def apkName = "AppRetention"

Properties signingProperties = new Properties()
File localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { signingProperties.load(it) }
}

def hasReleaseSigning = ["keyStoreFile", "keyStorePassword", "keyAlias", "keyAliasPassword"].every {
    signingProperties.getProperty(it) != null && !signingProperties.getProperty(it).trim().isEmpty()
}
def releaseStoreFile = hasReleaseSigning ? file(signingProperties.getProperty("keyStoreFile")) : null
hasReleaseSigning = hasReleaseSigning && releaseStoreFile != null && releaseStoreFile.exists()

android {
    namespace "com.hchen.appretention"
    compileSdk 36

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile releaseStoreFile
                storePassword signingProperties.getProperty("keyStorePassword")
                keyAlias signingProperties.getProperty("keyAlias")
                keyPassword signingProperties.getProperty("keyAliasPassword")
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    defaultConfig {
        applicationId "com.hchen.appretention"
        minSdk 29
        targetSdk 36
        versionCode 2026071801
        versionName "5.4"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
        signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    packaging {
        resources {
            excludes += [
                "/META-INF/**",
                "/kotlin/**",
                "/*.txt",
                "/*.bin",
                "/*.json"
            ]
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            outputFileName = "${apkName}-v${variant.versionName}(${variant.versionCode})_${variant.buildType.name}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

dependencies {
    compileOnly "de.robv.android.xposed:api:82"
    implementation "com.github.HChenX:HookTool:v.2.2.6"
    implementation "org.luckypray:dexkit:2.0.3"
    implementation "androidx.annotation:annotation:1.9.1"
    implementation "org.lsposed.hiddenapibypass:hiddenapibypass:6.1"
    compileOnly project(":app:collect")
    annotationProcessor project(":app:collect")
}
